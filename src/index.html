<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Controle de tarefas</h1>
    </header>
    <main>
        <section class="adicionar">
                <h2>Adicionar tarefas</h2>
                <input id="inputEl" type="text">
                <button id="addBtn">+ tarefa</button>
        </section>
        <section class="remover">
                <h2>Remover tarefas</h2>
                <input type="text">
                <button>- tarefa</button>
        </section>
         <section class="mensagem">
            <h2>Não há tarefas cadastradas!</h2>
        </section>
        <section class="exibir">
                <h2>Lista de tarefas</h2>
                <ul id="list">
                    <li><input type="checkbox" title="Marcar como concluído">Tarefa 1</li>
                    <li><input type="checkbox" title="Marcar como concluído">Tarefa 2</li>
                    <li><input type="checkbox" title="Marcar como concluído">Tarefa 3</li>
                </ul>
        </section>
    </main>
    <footer class="footer">
        <h4>Todos os direitos reservados</h4>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
